plugins {
    id 'com.android.application'
}

// Firebase is optional: the app runs in mock mode without it.
// The google-services plugin is applied only when the team lead has put
// app/google-services.json in place (it is git-ignored, see README).
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.campusmate'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.campusmate.campusmate'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // Release signing: keystore.properties is git-ignored (see README).
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) {
        def props = new Properties()
        keystoreFile.withInputStream { props.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Robolectric draws real pixels so tests can save screenshots.
                systemProperty 'robolectric.graphicsMode', 'NATIVE'
                // ./gradlew testDebugUnitTest -Pscreenshots  -> saves docs/screenshots/*.png
                if (project.hasProperty('screenshots')) {
                    systemProperty 'screenshots.dir', rootProject.file('docs/screenshots').absolutePath
                }
                maxHeapSize = '2g'
            }
        }
    }
}

dependencies {
    // AndroidX + Material Design 3
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Firebase Authentication + Cloud Firestore (no Storage, no Functions)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Local tests on the laptop (no phone or emulator needed)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    testImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
}
